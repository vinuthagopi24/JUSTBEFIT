services:
  - type: web
    name: justbefit
    runtime: python
    plan: free
    region: oregon
    buildCommand: "pip install -r requirements.txt && python seed_data.py"
    startCommand: "python serve.py"
    envVars:
      - key: PORT
        value: 10000
      - key: PYTHON_VERSION
        value: 3.10.11
      - key: SECRET_KEY
        generateValue: true
